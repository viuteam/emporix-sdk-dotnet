name: API baseline

# Moves the recorded public API from Unshipped to Shipped on the release pull
# request, so that the release ships with its own surface as the baseline the
# analyzer compares against from then on.
#
# It happens here rather than after publishing for one reason: on the pull
# request it is reviewed. The diff shows exactly which symbols are being promised
# to stay, which is the last chance to notice that something went public by
# accident.
on:
  pull_request:
    branches: [main]

concurrency:
  group: api-baseline-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  promote:
    name: Promote the API surface
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Only on the branch release-please maintains. Every other pull request adds
    # to Unshipped and leaves Shipped alone.
    if: startsWith(github.head_ref, 'release-please--')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Promote
        run: bash scripts/promote-public-api.sh

      - name: Commit if anything moved
        run: |
          if git diff --quiet; then
            echo "Already promoted — nothing to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Viu.Emporix/PublicAPI.Shipped.txt src/Viu.Emporix/PublicAPI.Unshipped.txt
          git commit -m "chore: promote the public API surface to shipped"
          git push
