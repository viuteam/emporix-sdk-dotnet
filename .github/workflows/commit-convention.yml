name: Commit convention

# Release Please reads the commit history to decide the next version and to write
# the changelog. Two ways a commit contributes nothing to either, both silent:
#
#   * a subject it cannot classify, and
#   * a message its parser rejects outright.
#
# The second is the dangerous one. A commit whose body the parser chokes on is
# dropped whole — no changelog entry, no version bump, one line in a log nobody
# reads. It happened here: `feat: bind the options from a configuration section`
# vanished from the release because its body contained
# `GetSection("Emporix"))`, and nested parentheses end the parse.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
      - name: Check the pull-request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The types release-please-config.json knows about, plus the ones it
          # deliberately hides. Anything else is a typo, not a new category.
          pattern='^(feat|fix|perf|refactor|docs|deps|chore|test|ci|build|style|revert)(\([a-z0-9._-]+\))?!?: .+'

          if [[ "$TITLE" =~ $pattern ]]; then
            echo "«$TITLE» is fine."
            exit 0
          fi

          cat >&2 <<MESSAGE
          The pull-request title has to read as a conventional commit:

              <type>[(scope)][!]: <what changed>

          for example

              feat: add the audit log service
              fix(cart): send the item YRN rather than the bare id
              feat!: require a JsonTypeInfo for cloud functions

          Yours is:

              $TITLE

          «feat» and «fix» reach the changelog and move the version; «docs»,
          «chore», «test», «ci» and «build» do not. A «!» or a «BREAKING CHANGE:»
          footer marks a break — before 1.0 that bumps the minor.

          The types are listed in release-please-config.json, and
          docs/releasing.md explains what each one does to a release.
          MESSAGE
          exit 1

  parseable:
    name: Parseable messages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Parse every commit with Release Please's own parser
        env:
          # A pull request checks what it adds; a push checks what it brought.
          RANGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          RANGE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          # Merge commits are excluded. GitHub writes «Merge pull request #2
          # from …», which is not a conventional commit and never will be, and
          # without --no-merges this check fails on every merged pull request.
          # What they merged is described by the commits inside them, which are
          # checked here.
          #
          # This comment used to add «Release Please ignores merge commits
          # anyway». It does not: when the subject fails to parse it falls back
          # to the body, and with the body set to the pull-request title that is
          # a second, duplicate changelog entry. The repository now allows only
          # squash merges, so none should reach main — but a merge made locally
          # still can, which is why the flag stays.
          #
          # The first push to a branch reports an all-zero «before». Nothing to
          # compare against, so check the head commit alone, unless it is itself
          # a merge.
          if [[ -z "$RANGE_BASE" || "$RANGE_BASE" =~ ^0+$ ]]; then
            commits="$(git rev-list --no-merges --max-count=1 "$RANGE_HEAD")"
          else
            commits="$(git rev-list --no-merges "$RANGE_BASE..$RANGE_HEAD")"
          fi

          if [[ -z "$commits" ]]; then
            echo "No commits to check."
            exit 0
          fi

          # The very library release-please uses, so this cannot drift from what
          # it will actually do with the message.
          npm install --silent --no-save @conventional-commits/parser

          failed=0
          for sha in $commits; do
            message="$(git log -1 --format=%B "$sha")"
            if ! MESSAGE="$message" SHA="$sha" node -e '
              const { parser } = require("@conventional-commits/parser");
              try {
                parser(process.env.MESSAGE);
                console.log("  ok    " + process.env.SHA.slice(0, 7) + "  " +
                  process.env.MESSAGE.split("\n")[0].slice(0, 60));
              } catch (error) {
                console.log("  FAIL  " + process.env.SHA.slice(0, 7) + "  " +
                  process.env.MESSAGE.split("\n")[0].slice(0, 60));
                console.log("        " + error.message.split("\n")[0]);
                process.exit(1);
              }
            '; then
              failed=1
            fi
          done

          if [[ "$failed" -ne 0 ]]; then
            cat >&2 <<'MESSAGE'

          Release Please drops a commit it cannot parse — the change ships, and
          neither the changelog nor the version records that it did.

          The usual cause is nested parentheses anywhere in the body, including
          inside a code fence:

              GetSection("Emporix"))     breaks
              GetSection of the options  fine

          Rewrite the body without them. The prose is worth keeping; the
          parentheses are not.
          MESSAGE
            exit 1
          fi
