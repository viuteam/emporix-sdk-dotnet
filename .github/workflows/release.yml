name: Release (tag)

# Publishing driven by a tag pushed by hand. Kept alongside release-please for
# two cases it cannot cover: the very first release, which has to happen before
# release-please has a published version to count from, and a release that has
# to go out without waiting for a pull request.
#
# The usual path is release-please.yml. Reach for this one deliberately.
on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ github.ref }}
    permissions:
      contents: read
      id-token: write
