name: Release (tag)

# Publishing driven by a tag pushed by hand. Kept alongside release-please for
# two cases it cannot cover: the very first release, which has to happen before
# release-please has a published version to count from, and a release that has
# to go out without waiting for a pull request.
#
# The usual path is release-please.yml. Reach for this one deliberately.
on:
  push:
    tags: ['v*']

  # Run it by hand to verify the setup. A manual run is always a dry run: it
  # stops after the token exchange, so it cannot publish even if someone means
  # it to. That is deliberate — the only way to release is to push a tag.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ github.ref }}
      dry-run: ${{ github.event_name == 'workflow_dispatch' }}
    # Without this the called workflow sees no secrets at all. Repository
    # variables need no passing; secrets do, and the difference is silent.
    secrets: inherit
    permissions:
      contents: read
      id-token: write
