name: Publish

# The publishing steps, in one place. Two workflows call this: the tag-triggered
# one for a release cut by hand, and the release-please one for a release cut by
# merging its pull request. Duplicating these steps across both is how the two
# paths drift until only one of them still works.
on:
  workflow_call:
    inputs:
      ref:
        description: >-
          The tag to publish. Checked out by name so that MinVer, which derives
          the version from the nearest tag, produces exactly that version. A
          checkout of the branch would build a height-suffixed prerelease
          instead.
        required: true
        type: string

      dry-run:
        description: >-
          Build, test and exchange the OIDC token, then stop before pushing.
          Proves the trusted-publishing policy, the profile name and the workflow
          file name the policy has to match, without publishing anything.
        required: false
        type: boolean
        default: false

    secrets:
      NUGET_USER:
        description: >-
          The nuget.org profile name to exchange the OIDC token as. Optional
          here because it may equally be a repository variable — see the login
          step below. A reusable workflow receives no secret unless the caller
          passes it, which is why both callers say `secrets: inherit`.
        required: false

jobs:
  publish:
    name: Publish to nuget.org
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      # Required for trusted publishing. Without it the OIDC token request fails
      # silently and the login step receives no key.
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # MinVer needs the tags, and shallow clones carry none.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Publish the sample with Native AOT
        run: dotnet publish samples/Viu.Emporix.Sample --configuration Release

      # Two packable projects sharing one version line: the library and the
      # mixin generator tool. The push step globs *.nupkg, so it needs no
      # change, and the NuGet trusted-publishing policy still names this
      # workflow — it compares the workflow containing the job, not the
      # workflow that started it.
      - name: Pack
        run: |
          dotnet pack src/Viu.Emporix --no-build --configuration Release --output artifacts
          dotnet pack src/Viu.Emporix.MixinSync --no-build --configuration Release --output artifacts

      # The packed file name carries the version MinVer derived, which is the only
      # honest place to read it: `-getProperty:PackageVersion` answers 1.0.0,
      # because MinVer sets the version in a target that the query does not run.
      # Printed before pushing, so the log says what went out.
      #
      # The two packages share one version line, so disagreement means a project
      # is not seeing MinVer and packed the SDK default instead. That shipped
      # once: 0.3.0 for the library beside 1.0.0 for the tool, and nuget.org
      # would have held the wrong number forever. Checked before the push, since
      # a version cannot be withdrawn afterwards.
      - name: Report what will be pushed, and check the versions agree
        run: |
          ls -1 artifacts/

          versions="$(ls -1 artifacts/*.nupkg \
            | sed -E 's/.*[^0-9]([0-9]+\.[0-9]+\.[0-9]+.*)\.nupkg/\1/' \
            | sort -u)"

          if [ "$(printf '%s\n' "$versions" | wc -l)" -ne 1 ]; then
            echo "::error::The packages disagree on the version: $(printf '%s ' $versions)"
            echo "Every packable project needs the MinVer reference. Check its csproj." >&2
            exit 1
          fi

          # A package without a readme reaches nuget.org showing nothing but its
          # description, and the version cannot be replaced. The tool shipped
          # that way once. Same class of mistake as the version: a new packable
          # project inherits neither, because there is no shared props layer.
          for package in artifacts/*.nupkg; do
            if ! unzip -l "$package" | grep -q 'README\.md'; then
              echo "::error::$(basename "$package") carries no README.md"
              echo "Add PackageReadmeFile and a None Include entry to its csproj." >&2
              exit 1
            fi
          done

          echo "All packages at $versions, each with a readme."

      # Trusted publishing: the workflow proves its identity to nuget.org over
      # OIDC and receives a key valid only for this run. No long-lived secret in
      # the repository — which matters more since 2026-08-17, when newly created
      # API keys became limited to 30 days.
      #
      # Requires a trusted-publishing policy on nuget.org for this repository
      # and workflow. See
      # https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
      # Fails here with a sentence rather than three steps later with a NuGet
      # error that says nothing about where the value was meant to come from.
      - name: Check that the nuget.org profile name is configured
        env:
          NUGET_USER: ${{ vars.NUGET_USER || secrets.NUGET_USER }}
        run: |
          if [[ -z "$NUGET_USER" ]]; then
            cat >&2 <<'MESSAGE'
          NUGET_USER is set neither as a repository variable nor as a secret.

          It is the nuget.org profile name — the last segment of
          nuget.org/profiles/… — and never an email address.

          A variable is the better place for it. The value is not secret: package
          owners are public on nuget.org. As a secret it is also masked in every
          log line it appears in, and a short name that occurs inside the
          repository path turns those logs into asterisks.
          MESSAGE
            exit 1
          fi

      - name: Exchange the OIDC token for a NuGet key
        uses: NuGet/login@v1
        id: login
        with:
          # Either place works. NuGet's own documentation suggests a secret;
          # a variable avoids the log masking described above.
          user: ${{ vars.NUGET_USER || secrets.NUGET_USER }}

      - name: Stop here — this was a dry run
        if: ${{ inputs.dry-run }}
        run: |
          echo "The token exchange succeeded, so the trusted-publishing policy"
          echo "matches this repository, this workflow file and this profile"
          echo "name. Nothing was pushed."

      - name: Push package and symbols
        if: ${{ !inputs.dry-run }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.dry-run }}
        with:
          name: release-packages
          path: artifacts/*
