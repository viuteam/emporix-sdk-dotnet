openapi: 3.0.0
info:
  title: Search Service
  version: ''
  description: The Emporix API Search Service allows you to search documents for a tenant, to store saved searches, and to manage the indexes and jobs used by that search.
  contact:
    name: Emporix
    url: 'https://www.emporix.com/contact-us'
servers:
  - url: 'https://api.emporix.io'
security:
  - OAuth2: []
paths:
  '/search/{tenant}/search/{type}':
    parameters:
      - $ref: '#/components/parameters/path_tenant'
      - $ref: '#/components/parameters/path_type'
    post:
      summary: Searching documents
      operationId: POST-search-tenant-type
      tags:
        - Search
      description: |-
        ![Preview](https://res.cloudinary.com/saas-ag/image/upload/v1752824268/emporix/icons/preview_api1.png)

        {% hint style="danger" %}
        This functionality is in preview mode - some of the features may not be fully operational yet.
        {% endhint %}

        Searches documents of one type. The `search.search_read` scope is required.

        For a direct search, the body names an index and supplies queries, a filter, or both. A list of queries matches when any query matches. An `and` group matches when every query matches. An `or` group matches when any query matches. Filters narrow the matches. The response is a JSON array of matching documents. When `fields` is omitted, each document also includes `_score`.

        When the body contains `searchQueryId`, the request runs a saved search. `query` is required. The saved search supplies the index, the filters, and the query shape. `query` replaces the text of every search term. A saved search that contains only filters keeps those filters.

        When the `X-Total-Count` request header is `true`, the response includes the `X-Total-Count` header with the number of matching documents. The response body stays an array.

        Filter and sort fields must be indexed. For a direct search, that is the index named by `index`. For a saved search, that is the index stored on the saved search.

        **Additional permissions requirements**:

        | Type | Scope requirements |
        | --- | --- |
        | `Custom Schema Type` | `schema.custominstance_read`, `custom.{type}_read`, or `custom.{type}_read_own` |

        A caller without one of those scopes receives `403 Forbidden`.
      security:
        - OAuth2:
            - search.search_read
      parameters:
        - $ref: '#/components/parameters/query_pageNumber'
        - $ref: '#/components/parameters/query_pageSize'
        - $ref: '#/components/parameters/query_sort'
        - $ref: '#/components/parameters/query_fields'
        - $ref: '#/components/parameters/header_Accept-Language'
        - $ref: '#/components/parameters/header_X-Total-Count'
      requestBody:
        $ref: '#/components/requestBodies/search_POST'
      responses:
        '200':
          description: The search succeeded. The body is the current page of matching documents.
          headers:
            X-Total-Count:
              description: Number of matching documents. Present only when the request `X-Total-Count` header is `true`.
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchHit'
              examples:
                Text search:
                  $ref: '#/components/examples/searchHits'
        '400':
          description: The request is invalid, or a filter or sort field is not indexed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                Index is required:
                  value:
                    code: 400
                    status: '400'
                    message: Index is required.
                Queries or filters are required:
                  value:
                    code: 400
                    status: '400'
                    message: Queries or filters are required.
                Type is not a custom entity:
                  value:
                    code: 400
                    status: '400'
                    message: Type is not a custom entity.
                Query is required:
                  value:
                    code: 400
                    status: '400'
                    message: Query is required.
                Search query id is required:
                  value:
                    code: 400
                    status: '400'
                    message: Search query id is required.
        '401':
          $ref: '#/components/responses/401_resp_common'
        '403':
          description: The access token does not include the required `search.search_read` scope, or a scope required to read the documents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                Missing search scope:
                  value:
                    code: 403
                    status: '403'
                    message: User not authorized.
                    details:
                      - message: Missing one of required scopes '[search.search_read]'
                Missing custom entity scope:
                  value:
                    code: 403
                    status: '403'
                    message: Missing one of required scopes '[schema.custominstance_read, custom.vehicle_read, custom.vehicle_read_own]'.
        '500':
          $ref: '#/components/responses/500_resp_common'
        '502':
          description: The Schema Service could not confirm that the type is a custom entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                Schema service unavailable:
                  value:
                    code: 502
                    status: '502'
                    message: Error while fetching custom entity='vehicle' for tenant='acme'. Error=Connection refused
        '404':
          description: No saved search with this id exists for the tenant and type. Returned when the body contains `searchQueryId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                Saved search not found:
                  value:
                    code: 404
                    status: '404'
                    message: The search query with id='red-cars' has not been found on tenant='acme'.
  '/search/{tenant}/search/queries':
    parameters:
      - $ref: '#/components/parameters/path_tenant'
    get:
      summary: Retrieving all saved searches
      operationId: GET-search-tenant-queries
      tags:
        - Saved Searches
      description: |-
        ![Preview](https://res.cloudinary.com/saas-ag/image/upload/v1752824268/emporix/icons/preview_api1.png)

        {% hint style="danger" %}
        This functionality is in preview mode - some of the features may not be fully operational yet.
        {% endhint %}

        Retrieves the saved searches for every custom schema type on the tenant. Each item includes `type`.
      security:
        - OAuth2:
            - search.search_read
      parameters:
        - $ref: '#/components/parameters/query_pageNumber'
        - $ref: '#/components/parameters/query_pageSize'
        - $ref: '#/components/parameters/query_sort_createdAt'
        - $ref: '#/components/parameters/query_q'
        - $ref: '#/components/parameters/query_fields_query'
        - $ref: '#/components/parameters/header_Accept-Language'
        - $ref: '#/components/parameters/header_X-Total-Count'
      responses:
        '200':
          description: The request succeeded. The body is the current page of saved searches.
          headers:
            X-Total-Count:
              description: Number of saved searches. Present only when the request `X-Total-Count` header is `true`.
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedQuery'
              examples:
                Saved searches for a tenant:
                  value:
                    - id: red-cars
                      type: vehicle
                      name:
                        en: Red cars
                      description:
                        en: Vehicles whose name contains red
                      indexId: vehicles
                      queries:
                        type: TEXT
                        query: red
                        field: name.en
                      metadata:
                        version: 1
                        createdAt: '2026-03-12T10:00:00.000Z'
                        modifiedAt: '2026-03-12T10:00:00.000Z'
                    - id: city-bikes
                      type: bike
                      name:
                        en: City bikes
                      description:
                        en: Bikes whose name contains city
                      indexId: bikes
                      queries:
                        type: TEXT
                        query: city
                        field: name.en
                      metadata:
                        version: 1
                        createdAt: '2026-03-13T10:00:00.000Z'
                        modifiedAt: '2026-03-13T10:00:00.000Z'
        '401':
          $ref: '#/components/responses/401_resp_common'
        '403':
          $ref: '#/components/responses/403_search_read'
        '500':
          $ref: '#/components/responses/500_resp_common'
  '/search/{tenant}/search/{type}/queries':
    parameters:
      - $ref: '#/components/parameters/path_tenant'
      - $ref: '#/components/parameters/path_type'
    get:
      summary: Retrieving saved searches
      operationId: GET-search-tenant-type-queries
      tags:
        - Saved Searches
      description: |-
        ![Preview](https://res.cloudinary.com/saas-ag/image/upload/v1752824268/emporix/icons/preview_api1.png)

        {% hint style="danger" %}
        This functionality is in preview mode - some of the features may not be fully operational yet.
        {% endhint %}

        Retrieves the saved searches for one custom schema type.

        When `sort` is omitted, saved searches are ordered by `metadata.createdAt` descending. When the `X-Total-Count` request header is `true`, the response includes the `X-Total-Count` header with the number of saved searches. The response body stays an array.
      security:
        - OAuth2:
            - search.search_read
      parameters:
        - $ref: '#/components/parameters/query_pageNumber'
        - $ref: '#/components/parameters/query_pageSize'
        - $ref: '#/components/parameters/query_sort_createdAt'
        - $ref: '#/components/parameters/query_q'
        - $ref: '#/components/parameters/query_fields_query'
        - $ref: '#/components/parameters/header_Accept-Language'
        - $ref: '#/components/parameters/header_X-Total-Count'
      responses:
        '200':
          description: The request succeeded. The body is the current page of saved searches.
          headers:
            X-Total-Count:
              description: Number of saved searches. Present only when the request `X-Total-Count` header is `true`.
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedQuery'
              examples:
                Saved searches for a type:
                  value:
                    - id: red-cars
                      type: vehicle
                      name:
                        en: Red cars
                      description:
                        en: Vehicles whose name contains red
                      indexId: vehicles
                      queries:
                        type: TEXT
                        query: red
                        field: name.en
                      metadata:
                        version: 1
                        createdAt: '2026-03-12T10:00:00.000Z'
                        modifiedAt: '2026-03-12T10:00:00.000Z'
        '401':
          $ref: '#/components/responses/401_resp_common'
        '403':
          $ref: '#/components/responses/403_search_read'
        '500':
          $ref: '#/components/responses/500_resp_common'
  '/search/{tenant}/search/{type}/queries/{id}':
    parameters:
      - $ref: '#/components/parameters/path_tenant'
      - $ref: '#/components/parameters/path_type'
      - $ref: '#/components/parameters/path_query_id'
    put:
      summary: Upserting a saved search
      operationId: PUT-search-tenant-type-queries-id
      tags:
        - Saved Searches
      description: |-
        ![Preview](https://res.cloudinary.com/saas-ag/image/upload/v1752824268/emporix/icons/preview_api1.png)

        {% hint style="danger" %}
        This functionality is in preview mode - some of the features may not be fully operational yet.
        {% endhint %}

        Creates or replaces the saved search identified by `{id}` for one custom schema type. Unknown properties in the body are ignored. Saving does not start an index build.

        A new saved search returns `201 Created` and the saved search id. Replacing an existing saved search returns `204 No Content`. `index` must already exist for this type. The body must include `queries`, `filters`, or both.

        `metadata` can be omitted when the saved search is created. An update requires `metadata.version`.
      security:
        - OAuth2:
            - search.search_manage
      parameters:
        - $ref: '#/components/parameters/header_Content-Language'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedQueryRequest'
            examples:
              Create a saved search:
                value:
                  name:
                    en: Red cars
                  description:
                    en: Vehicles whose name contains red
                  index: vehicles
                  queries:
                    type: TEXT
                    query: red
                    field: name.en
                    boost: 2
      responses:
        '201':
          description: The saved search was created. The body is the saved search id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedQueryId'
              examples:
                Saved search created:
                  value:
                    id: red-cars
        '204':
          description: The saved search was replaced. The response has no body.
        '400':
          description: The saved search id, criteria, or metadata version is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                Index is required:
                  value:
                    code: 400
                    status: '400'
                    message: Index is required.
                Queries or filters are required:
                  value:
                    code: 400
                    status: '400'
                    message: Queries or filters are required.
                Version is required:
                  value:
                    code: 400
                    status: '400'
                    message: metadata.version is required to update a query.
                Query id does not match the path:
                  value:
                    code: 400
                    status: '400'
                    message: Query id must match the path.
        '401':
          $ref: '#/components/responses/401_resp_common'
        '403':
          $ref: '#/components/responses/403_search_manage'
        '404':
          description: No index with the id in `index` exists for this type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                Index not found:
                  value:
                    code: 404
                    status: '404'
                    message: The index with id='vehicles' has not been found on tenant='acme'.
        '409':
          description: '`metadata.version` does not match the stored saved search.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                Version does not match:
                  value:
                    code: 409
                    status: '409'
                    message: 'Cannot find the entity with an id: red-cars--vehicle and version: 2. It is possible to update an entity with the latest version only. Fetch the entity to get the latest version.'
        '500':
          $ref: '#/components/responses/500_resp_common'
    get:
      summary: Retrieving a saved search
      operationId: GET-search-tenant-type-queries-id
      tags:
        - Saved Searches
      description: |-
        ![Preview](https://res.cloudinary.com/saas-ag/image/upload/v1752824268/emporix/icons/preview_api1.png)

        {% hint style="danger" %}
        This functionality is in preview mode - some of the features may not be fully operational yet.
        {% endhint %}

        Retrieves one saved search.
      security:
        - OAuth2:
            - search.search_read
      parameters:
        - $ref: '#/components/parameters/query_fields_query'
        - $ref: '#/components/parameters/header_Accept-Language'
      responses:
        '200':
          description: The request succeeded. The body is the saved search.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedQuery'
              examples:
                One saved search:
                  value:
                    id: red-cars
                    type: vehicle
                    name:
                      en: Red cars
                    description:
                      en: Vehicles whose name contains red
                    indexId: vehicles
                    queries:
                      type: TEXT
                      query: red
                      field: name.en
                      boost: 2
                    metadata:
                      version: 1
                      createdAt: '2026-03-12T10:00:00.000Z'
                      modifiedAt: '2026-03-12T10:00:00.000Z'
        '401':
          $ref: '#/components/responses/401_resp_common'
        '403':
          $ref: '#/components/responses/403_search_read'
        '404':
          description: No saved search with this id exists for the type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                Saved search not found:
                  value:
                    code: 404
                    status: '404'
                    message: The search query with id='red-cars' has not been found on tenant='acme'.
        '500':
          $ref: '#/components/responses/500_resp_common'
    delete:
      summary: Deleting a saved search
      operationId: DELETE-search-tenant-type-queries-id
      tags:
        - Saved Searches
      description: |-
        ![Preview](https://res.cloudinary.com/saas-ag/image/upload/v1752824268/emporix/icons/preview_api1.png)

        {% hint style="danger" %}
        This functionality is in preview mode - some of the features may not be fully operational yet.
        {% endhint %}

        Deletes one saved search. Deleting does not start an index build.
      security:
        - OAuth2:
            - search.search_manage
      responses:
        '204':
          description: The saved search was deleted. The response has no body.
        '401':
          $ref: '#/components/responses/401_resp_common'
        '403':
          $ref: '#/components/responses/403_search_manage'
        '404':
          description: No saved search with this id exists for the type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                Saved search not found:
                  value:
                    code: 404
                    status: '404'
                    message: The search query with id='red-cars' has not been found on tenant='acme'.
        '500':
          $ref: '#/components/responses/500_resp_common'
  '/search/{tenant}/search/indexes':
    parameters:
      - $ref: '#/components/parameters/path_tenant'
    get:
      summary: Retrieving all search indexes
      operationId: GET-search-tenant-indexes
      tags:
        - Search Indexes
      description: |-
        ![Preview](https://res.cloudinary.com/saas-ag/image/upload/v1752824268/emporix/icons/preview_api1.png)

        {% hint style="danger" %}
        This functionality is in preview mode - some of the features may not be fully operational yet.
        {% endhint %}

        Retrieves the search indexes for every custom schema type on the tenant. Each item includes `type`.

        When `sort` is omitted, indexes are ordered by `metadata.createdAt` descending. When the `X-Total-Count` request header is `true`, the response includes the `X-Total-Count` header with the number of indexes. The response body stays an array.
      security:
        - OAuth2:
            - search.search_read
      parameters:
        - $ref: '#/components/parameters/query_pageNumber'
        - $ref: '#/components/parameters/query_pageSize'
        - $ref: '#/components/parameters/query_sort_createdAt'
        - $ref: '#/components/parameters/query_q'
        - $ref: '#/components/parameters/query_fields_index'
        - $ref: '#/components/parameters/header_Accept-Language'
        - $ref: '#/components/parameters/header_X-Total-Count'
      responses:
        '200':
          description: The request succeeded. The body is the current page of indexes.
          headers:
            X-Total-Count:
              description: Number of indexes. Present only when the request `X-Total-Count` header is `true`.
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchIndex'
              examples:
                Indexes for a tenant:
                  value:
                    - id: vehicles
                      type: vehicle
                      name:
                        en: Vehicles
                      description:
                        en: Search vehicles by name and power
                      status: ready
                      metadata:
                        version: 1
                        createdAt: '2026-03-12T10:00:00.000Z'
                        modifiedAt: '2026-03-12T10:00:00.000Z'
                    - id: bikes
                      type: bike
                      name:
                        en: Bikes
                      description:
                        en: Search bikes by name
                      status: ready
                      metadata:
                        version: 1
                        createdAt: '2026-03-13T10:00:00.000Z'
                        modifiedAt: '2026-03-13T10:00:00.000Z'
        '401':
          $ref: '#/components/responses/401_resp_common'
        '403':
          $ref: '#/components/responses/403_search_read'
        '500':
          $ref: '#/components/responses/500_resp_common'
  '/search/{tenant}/search/{type}/indexes':
    parameters:
      - $ref: '#/components/parameters/path_tenant'
      - $ref: '#/components/parameters/path_type'
    get:
      summary: Retrieving search indexes
      operationId: GET-search-tenant-type-indexes
      tags:
        - Search Indexes
      description: |-
        ![Preview](https://res.cloudinary.com/saas-ag/image/upload/v1752824268/emporix/icons/preview_api1.png)

        {% hint style="danger" %}
        This functionality is in preview mode - some of the features may not be fully operational yet.
        {% endhint %}

        Retrieves the search indexes for one custom schema type.

        When `sort` is omitted, indexes are ordered by `metadata.createdAt` descending. When the `X-Total-Count` request header is `true`, the response includes the `X-Total-Count` header with the number of indexes. The response body stays an array.
      security:
        - OAuth2:
            - search.search_read
      parameters:
        - $ref: '#/components/parameters/query_pageNumber'
        - $ref: '#/components/parameters/query_pageSize'
        - $ref: '#/components/parameters/query_sort_createdAt'
        - $ref: '#/components/parameters/query_q'
        - $ref: '#/components/parameters/query_fields_index'
        - $ref: '#/components/parameters/header_Accept-Language'
        - $ref: '#/components/parameters/header_X-Total-Count'
      responses:
        '200':
          description: The request succeeded. The body is the current page of indexes.
          headers:
            X-Total-Count:
              description: Number of indexes. Present only when the request `X-Total-Count` header is `true`.
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchIndex'
              examples:
                Indexes for a type:
                  value:
                    - id: vehicles
                      type: vehicle
                      name:
                        en: Vehicles
                      description:
                        en: Search vehicles by name and power
                      status: ready
                      metadata:
                        version: 1
                        createdAt: '2026-03-12T10:00:00.000Z'
                        modifiedAt: '2026-03-12T10:00:00.000Z'
        '401':
          $ref: '#/components/responses/401_resp_common'
        '403':
          $ref: '#/components/responses/403_search_read'
        '500':
          $ref: '#/components/responses/500_resp_common'
  '/search/{tenant}/search/{type}/indexes/{id}':
    parameters:
      - $ref: '#/components/parameters/path_tenant'
      - $ref: '#/components/parameters/path_type'
      - $ref: '#/components/parameters/path_index_id'
    put:
      summary: Upserting a search index
      operationId: PUT-search-tenant-type-indexes-id
      tags:
        - Search Indexes
      description: |-
        ![Preview](https://res.cloudinary.com/saas-ag/image/upload/v1752824268/emporix/icons/preview_api1.png)

        {% hint style="danger" %}
        This functionality is in preview mode - some of the features may not be fully operational yet.
        {% endhint %}

        Creates or updates the search index identified by `{id}` for one custom schema type. Unknown properties in the body are ignored.

        A new index returns `202 Accepted` and the id of a job that builds the index. Saving an index whose status is `building` or `failed`, or whose field definition changed, also returns `202 Accepted` and starts an update job. An index whose status is `ready` and whose field definition is unchanged returns `204 No Content` and does not start a job. `name` and `description` can still change in that case. A job that is already in progress for this index returns `409 Conflict`.

        `metadata` can be omitted when the index is created. An update of an existing index requires `metadata.version`.
      security:
        - OAuth2:
            - search.search_manage
      parameters:
        - $ref: '#/components/parameters/header_Content-Language'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexRequest'
            examples:
              Create an index:
                value:
                  name:
                    en: Vehicles
                  description:
                    en: Search vehicles by name and power
                  fields:
                    - path: name.en
                      text: true
                      autocomplete: PREFIX
                    - path: code
                      text: true
                      exact: true
                    - path: mixins.brand.horsepower
                      exact: true
      responses:
        '202':
          description: The index build has started. The body is the job id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobId'
              examples:
                Job started:
                  value:
                    id: 66f1a2b3c4d5e6f708192a3b
        '204':
          description: The index is already ready and the field definition is unchanged. No job was started.
        '400':
          description: The index id, field list, or metadata version is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                Index fields are required:
                  value:
                    code: 400
                    status: '400'
                    message: Index fields are required.
                Version is required:
                  value:
                    code: 400
                    status: '400'
                    message: metadata.version is required to update an index.
                Field does not exist:
                  value:
                    code: 400
                    status: '400'
                    message: Field 'name' does not exist.
                Index id does not match the path:
                  value:
                    code: 400
                    status: '400'
                    message: Index id must match the path.
        '401':
          $ref: '#/components/responses/401_resp_common'
        '403':
          $ref: '#/components/responses/403_search_manage'
        '409':
          description: An index job is already in progress, or `metadata.version` does not match the stored index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                Job already in progress:
                  value:
                    code: 409
                    status: '409'
                    message: An index job is already in progress.
        '500':
          $ref: '#/components/responses/500_resp_common'
    get:
      summary: Retrieving a search index
      operationId: GET-search-tenant-type-indexes-id
      tags:
        - Search Indexes
      description: |-
        ![Preview](https://res.cloudinary.com/saas-ag/image/upload/v1752824268/emporix/icons/preview_api1.png)

        {% hint style="danger" %}
        This functionality is in preview mode - some of the features may not be fully operational yet.
        {% endhint %}

        Retrieves one search index.
      security:
        - OAuth2:
            - search.search_read
      parameters:
        - $ref: '#/components/parameters/query_fields_index'
        - $ref: '#/components/parameters/header_Accept-Language'
      responses:
        '200':
          description: The index exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchIndex'
              examples:
                One index:
                  value:
                    id: vehicles
                    type: vehicle
                    name:
                      en: Vehicles
                    description:
                      en: Search vehicles by name and power
                    fields:
                      - path: name.en
                        text: true
                        autocomplete: PREFIX
                      - path: code
                        text: true
                        exact: true
                    status: ready
                    metadata:
                      version: 1
                      createdAt: '2026-03-12T10:00:00.000Z'
                      modifiedAt: '2026-03-12T10:00:00.000Z'
        '401':
          $ref: '#/components/responses/401_resp_common'
        '403':
          $ref: '#/components/responses/403_search_read'
        '404':
          description: No index with this id exists for the type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          $ref: '#/components/responses/500_resp_common'
    delete:
      summary: Deleting a search index
      operationId: DELETE-search-tenant-type-indexes-id
      tags:
        - Search Indexes
      description: |-
        ![Preview](https://res.cloudinary.com/saas-ag/image/upload/v1752824268/emporix/icons/preview_api1.png)

        {% hint style="danger" %}
        This functionality is in preview mode - some of the features may not be fully operational yet.
        {% endhint %}

        Starts deletion of one search index. The response is the id of the job that removes the index.
      security:
        - OAuth2:
            - search.search_manage
      responses:
        '202':
          description: Index deletion has started. The body is the job id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobId'
              examples:
                Job started:
                  value:
                    id: 66f1a2b3c4d5e6f708192a3c
        '401':
          $ref: '#/components/responses/401_resp_common'
        '403':
          $ref: '#/components/responses/403_search_manage'
        '404':
          description: No index with this id exists for the type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '409':
          description: An index job is already in progress for this index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                Job already in progress:
                  value:
                    code: 409
                    status: '409'
                    message: An index job is already in progress.
        '500':
          $ref: '#/components/responses/500_resp_common'
  '/search/{tenant}/jobs':
