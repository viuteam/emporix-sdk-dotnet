  '/search/{tenant}/jobs/{id}':
    parameters:
      - $ref: '#/components/parameters/path_tenant'
      - $ref: '#/components/parameters/path_job_id'
    get:
      summary: Retrieving an index job
      operationId: GET-search-tenant-jobs-id
      tags:
        - Index Jobs
      description: |-
        ![Preview](https://res.cloudinary.com/saas-ag/image/upload/v1752824268/emporix/icons/preview_api1.png)

        {% hint style="danger" %}
        This functionality is in preview mode - some of the features may not be fully operational yet.
        {% endhint %}

        Retrieves one index job.
      security:
        - OAuth2:
            - search.search_read
      parameters:
