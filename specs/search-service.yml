              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          $ref: '#/components/responses/500_resp_common'
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: 'https://api.emporix.io/oauth/token'
          scopes:
            search.search_read: Needed to search documents, to read saved searches, and to read search indexes and index jobs.
            search.search_manage: Needed to create, update, and delete saved searches and search indexes.
            schema.custominstance_read: Needed to read every custom entity instance. When this scope is absent, `custom.{type}_read` or `custom.{type}_read_own` can still allow the search.
  parameters:
    path_tenant:
      name: tenant
      in: path
      required: true
      description: |
        Your Emporix tenant's name.
        **Note**: The tenant should always be written in lowercase.
      schema:
        pattern: '^[a-z][a-z0-9]+$'
        minLength: 3
        maxLength: 16
        type: string
    path_type:
      name: type
      in: path
      required: true
      description: |
        Type of documents to search.

        For now, only custom schema types are supported.
      schema:
        type: string
        example: vehicle
    query_pageNumber:
      name: pageNumber
      in: query
      description: |
        Page number to be retrieved. The number of the first page is 1.
      schema:
        default: 1
        minimum: 1
        type: integer
    query_pageSize:
      name: pageSize
      in: query
      description: Number of items to be retrieved per page.
      schema:
        default: 60
        minimum: 1
        maximum: 2000
        type: integer
    query_sort:
      name: sort
      in: query
      description: |-
        List of properties used to sort the results, separated by commas. The order of properties indicates their priority in sorting.

        Possible values:

        * `{fieldName}`
        * `{fieldName}:ASC`
        * `{fieldName}:DESC`

        When the direction is omitted, the field is sorted in ascending order.

        For the localized `name` field, the language can be included as `name.{language}`. When the language is omitted, the service uses the language from `Accept-Language`.

        When `sort` is omitted, results are ordered by search relevance.
      schema:
        type: string
        example: 'name:ASC,id:DESC'
    query_fields:
      name: fields
      in: query
      description: |-
        Comma-separated list of fields to return. When the parameter is omitted, the stored document is returned.

        `id` selects the document identifier. `_score` selects the relevance score.
      schema:
        type: string
        example: 'id,name,_score'
    header_Accept-Language:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
      description: |
        List of language codes acceptable for the response.

        * If the header is set to a language or a list of languages, the service returns the first requested language that has a translation. Localized fields are maps with that language code as the key.
        * If the header is set to `*`, localized fields are retrieved as maps of translations, where the keys are language codes and values are the fields in their respective languages.
        * If the header is empty, localized fields are retrieved as maps containing a single translation, where the key is a language code and the value is the field in the specified language. The endpoint assumes that localized fields are to be retrieved in the tenant's default language defined in the Configuration Service.
        * If none of the requested languages has a translation, the localized fields are omitted from the response.
    header_X-Total-Count:
      name: X-Total-Count
      in: header
      required: false
      description: Flag indicating whether the total count of retrieved items should be returned.
      schema:
        default: false
        type: boolean
    header_Content-Language:
      name: Content-Language
      in: header
      required: false
      description: Language of the localized `name` and `description` in the request body. Each language key in those maps must be configured for the tenant.
      schema:
        type: string
        example: en
    path_index_id:
      name: id
      in: path
      required: true
      description: Index id. Use 1 to 66 characters. Allowed characters are letters, digits, underscore, and hyphen.
      schema:
        type: string
        pattern: '^[\w-]{1,66}$'
        example: vehicles
    path_job_id:
      name: id
      in: path
      required: true
      description: Identifier of the index job.
      schema:
        type: string
        example: 66f1a2b3c4d5e6f708192a3b
    query_sort_createdAt:
      name: sort
      in: query
      description: |-
        Comma-separated list of properties used to sort the results. The order of properties indicates their priority.

        Possible values:

        * `{fieldName}`
        * `{fieldName}:ASC`
        * `{fieldName}:DESC`

        When the direction is omitted, the field is sorted in ascending order. When `sort` is omitted, results are ordered by `metadata.createdAt` descending.
      schema:
        type: string
        example: 'name:ASC'
    query_q:
      name: q
      in: query
      description: |-
        A standard query parameter is used to search for specific values.

        See: [Standard practises - Query parameter](https://developer.emporix.io/api-documentation/standard-practices/q-param)
      schema:
        type: string
    query_fields_index:
      name: fields
      in: query
      description: |-
        Comma-separated list of index properties to return. When the parameter is omitted, the index is returned in full.
      schema:
        type: string
        example: 'id,name,status'
    query_fields_job:
      name: fields
      in: query
      description: Comma-separated list of job properties to return. When the parameter is omitted, the job is returned in full.
      schema:
        type: string
        example: 'id,status,type,indexId'
    path_query_id:
      name: id
      in: path
      required: true
      description: Saved search id. Use 1 to 66 characters. Allowed characters are letters, digits, underscore, and hyphen.
      schema:
        type: string
        pattern: '^[\w-]{1,66}$'
        example: red-cars
    query_fields_query:
      name: fields
      in: query
      description: Comma-separated list of saved search properties to return. When the parameter is omitted, the saved search is returned in full.
      schema:
        type: string
        example: 'id,name,indexId'
  requestBodies:
    search_POST:
      required: true
      content:
        application/json:
          schema:
            description: |-
              A direct search or a saved search. When `searchQueryId` is present, the service runs the saved search and ignores the other properties.
            anyOf:
              - $ref: '#/components/schemas/SearchRequest'
              - $ref: '#/components/schemas/SavedSearchCall'
          examples:
            Text search:
              $ref: '#/components/examples/textSearchRequest'
            Fuzzy search:
              $ref: '#/components/examples/fuzzySearchRequest'
            Fuzzy search with two edits:
              $ref: '#/components/examples/fuzzyTwoEditsRequest'
            Phrase search:
              $ref: '#/components/examples/phraseSearchRequest'
            Autocomplete search:
              $ref: '#/components/examples/autocompleteSearchRequest'
            Wildcard search:
              $ref: '#/components/examples/wildcardSearchRequest'
            Boosted fields:
              $ref: '#/components/examples/boostedFieldsRequest'
            Several queries:
              $ref: '#/components/examples/severalQueriesRequest'
            And queries:
              $ref: '#/components/examples/andQueriesRequest'
            Filter only:
              $ref: '#/components/examples/filterSearchRequest'
            Range filter:
              $ref: '#/components/examples/rangeFilterRequest'
            List filter:
              $ref: '#/components/examples/inFilterRequest'
            Exists filter:
              $ref: '#/components/examples/existsFilterRequest'
            Nested filters:
              $ref: '#/components/examples/nestedFilterRequest'
            Saved search:
              $ref: '#/components/examples/savedSearchCall'
  responses:
    401_resp_common:
      description: The authorization token is invalid or has expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessageFault'
          examples:
            Invalid access token:
              value:
                fault:
                  faultstring: Invalid access token
                  detail:
                    errorcode: oauth.v2.InvalidAccessToken
            Access token expired:
              value:
                fault:
                  faultstring: Access Token expired
                  detail:
                    errorcode: keymanagement.service.access_token_expired
    403_search_read:
      description: The access token does not include `search.search_read`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            Missing search scope:
              value:
                code: 403
                status: '403'
                message: User not authorized.
                details:
                  - message: Missing one of required scopes '[search.search_read]'
    403_search_manage:
      description: The access token does not include `search.search_manage`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            Missing manage scope:
              value:
                code: 403
                status: '403'
                message: User not authorized.
                details:
                  - message: Missing one of required scopes '[search.search_manage]'
    500_resp_common:
      description: A server-side error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            Internal Server Error:
              value:
                code: 500
                status: '500'
                message: The server has encountered an error during processing the request data while trying to connect to the database.
  schemas:
    IndexRequest:
      type: object
      description: Definition of a search index. Unknown properties are ignored.
      properties:
        id:
          type: string
          description: Index id. Optional. When it is present, it must equal the `{id}` path parameter.
          example: vehicles
        name:
          type: object
          additionalProperties:
            type: string
          description: Localized name of the index.
          example:
            en: Vehicles
        description:
          type: object
          additionalProperties:
            type: string
          description: Localized description of the index.
          example:
            en: Search vehicles by name and power
        fields:
          type: array
          description: |-
            Fields to index. At least one field is required.

            A string field needs `text`, `autocomplete`, or `exact`. A number, boolean, or date field supports only `exact` set to `true`. `time`, `list`, `object`, and `dictionary` fields cannot be indexed. A path must be a field defined on the schema type, or `metadata.createdAt`, or `metadata.modifiedAt`. Any other path is rejected.
          items:
            $ref: '#/components/schemas/IndexField'
        metadata:
          $ref: '#/components/schemas/IndexMetadataRequest'
      required:
        - fields
    IndexField:
      type: object
      description: One field in a search index.
      properties:
        path:
          type: string
          description: Full stored field path. Use `name.en`, not `name`.
          example: name.en
        text:
          type: boolean
          description: |-
            Indexes a string for `TEXT` and `PHRASE` search, and for `WILDCARD` on the whole stored value. A wildcard match keeps the stored case.
          example: true
        autocomplete:
          type: string
          description: |-
            Indexes a string for `AUTOCOMPLETE`. `PREFIX` matches the start of a word. `NGRAM` matches a character sequence inside a word.
          enum:
            - PREFIX
            - NGRAM
          example: PREFIX
        exact:
          type: boolean
          description: Indexes the field for equality, list, range, existence, and sort. Required for number, boolean, and date fields.
          example: true
      required:
        - path
    IndexMetadataRequest:
      type: object
      description: Optimistic lock for an index update. Required when the index already exists.
      properties:
        version:
          type: integer
          minimum: 1
          description: Current version of the index. The first stored version is 1.
          example: 1
      required:
        - version
    SearchIndex:
      type: object
      description: A search index.
      properties:
        id:
          type: string
          description: Index id.
          example: vehicles
        type:
          type: string
          description: Custom schema type this index belongs to.
          example: vehicle
        name:
          type: object
          additionalProperties:
            type: string
          description: Localized name. A specific `Accept-Language` value keeps one language. `*` keeps every stored language.
          example:
            en: Vehicles
        description:
          type: object
          additionalProperties:
            type: string
          description: Localized description. A specific `Accept-Language` value keeps one language. `*` keeps every stored language.
          example:
            en: Search vehicles by name and power
        fields:
          type: array
          description: Fields stored for this index.
          items:
            $ref: '#/components/schemas/IndexField'
        status:
          type: string
          description: Build state of the index.
          enum:
            - building
            - ready
            - failed
          example: ready
        metadata:
          $ref: '#/components/schemas/ResourceMetadata'
    JobId:
      type: object
      description: Identifier of an index job.
      properties:
        id:
          type: string
          description: Job id.
          example: 66f1a2b3c4d5e6f708192a3b
    IndexJob:
      type: object
      description: One index build or deletion job.
      properties:
        id:
          type: string
          description: Job id.
          example: 66f1a2b3c4d5e6f708192a3b
        status:
          type: string
          description: Current state of the job.
          enum:
            - in_progress
            - success
            - failure
          example: in_progress
        type:
          type: string
          description: Kind of index change.
          enum:
            - create_index
            - update_index
            - delete_index
          example: create_index
        indexId:
          type: string
          description: Index id.
          example: vehicles
        message:
          type: string
          description: Text recorded when the job started.
          example: Creating index vehicles--vehicle for type vehicle
        response:
          type: string
          description: Result text recorded when the job finishes.
          example: Index created.
        metadata:
          $ref: '#/components/schemas/ResourceMetadata'
    ResourceMetadata:
      type: object
      description: Version and timestamps for a stored resource.
      properties:
        version:
          type: integer
          description: Stored version. The first version is 1.
          example: 1
        createdAt:
          type: string
          format: date-time
          description: Time when the resource was created.
          example: '2026-03-12T10:00:00.000Z'
        modifiedAt:
          type: string
          format: date-time
          description: Time when the resource was last modified.
          example: '2026-03-12T10:04:00.000Z'
    SearchRequest:
      type: object
      description: |-
        Search criteria. Provide `queries`, `filters`, or both. `index` is always required. Unknown properties are ignored. Use `SavedSearchCall` instead when the body contains `searchQueryId`.

        A list of queries matches when any query matches. An `and` group matches when every query matches. An `or` group matches when any query matches. Filters narrow those matches and do not change the score.
      properties:
        queries:
          description: |-
            Queries to match. Use an array as shorthand for an `or` group, or an `and` group, an `or` group, or one query.

            `name` is localized. The search uses the field path as sent. It does not expand `name` with the `Accept-Language` value.
          allOf:
            - $ref: '#/components/schemas/QueryNode'
        filters:
          $ref: '#/components/schemas/FilterNode'
        index:
          type: string
          description: Name of the index to query.
          example: custom-entities
      required:
        - index
      anyOf:
        - required:
            - queries
        - required:
            - filters
    SavedSearchCall:
      type: object
      description: |-
        Runs one saved search. Use this shape when `searchQueryId` is present. The saved search supplies the index, the filters, and the query shape. `query` replaces the text of every search term. A saved search that contains only filters keeps those filters.
      properties:
        query:
          type: string
          minLength: 1
          description: Text applied to every search term in the saved search. The value must not be blank.
          example: diesel engine
        searchQueryId:
          type: string
          description: Id of the saved search for this schema type.
          example: red-cars
      required:
        - query
        - searchQueryId
    SavedQueryRequest:
      type: object
      description: |-
        Definition of a saved search. Unknown properties are ignored. The body must include `queries`, `filters`, or both. `index` must already exist for the schema type.
      properties:
        id:
          type: string
          description: Saved search id. Optional. When it is present, it must equal the `{id}` path parameter.
          example: red-cars
        name:
          type: object
          additionalProperties:
            type: string
          description: Localized name of the saved search.
          example:
            en: Red cars
        description:
          type: object
          additionalProperties:
            type: string
          description: Localized description of the saved search.
          example:
            en: Vehicles whose name contains red
        index:
          type: string
          description: Id of the search index this saved search uses.
          example: vehicles
        queries:
          description: Queries stored with the saved search. A list is stored as one `or` group. A single query object is stored unchanged.
          allOf:
            - $ref: '#/components/schemas/QueryNode'
        filters:
          $ref: '#/components/schemas/FilterNode'
        metadata:
          $ref: '#/components/schemas/QueryMetadataRequest'
      required:
        - index
      anyOf:
        - required:
            - queries
        - required:
            - filters
    QueryMetadataRequest:
      type: object
      description: Optimistic lock for a saved search update. Required when the saved search already exists.
      properties:
        version:
          type: integer
          minimum: 1
          description: Current stored version. Required on update. A missing version on update returns 400. A version that does not match the stored saved search returns 409.
          example: 1
      required:
        - version
    SavedQueryId:
      type: object
      description: Identifier of a created saved search.
      properties:
        id:
          type: string
          description: Saved search id.
          example: red-cars
      required:
        - id
    SavedQuery:
      type: object
      description: One stored saved search. The request field `index` is returned as `indexId`. `queries` is one query node. A list sent on save is returned as one `or` group.
      properties:
        id:
          type: string
          description: Saved search id.
          example: red-cars
        name:
          type: object
          additionalProperties:
            type: string
          description: Localized name of the saved search.
          example:
            en: Red cars
        description:
          type: object
          additionalProperties:
            type: string
          description: Localized description of the saved search.
          example:
            en: Vehicles whose name contains red
        type:
          type: string
          description: Custom schema type this saved search belongs to.
          example: vehicle
        indexId:
          type: string
          description: Id of the search index this saved search uses.
          example: vehicles
        queries:
          $ref: '#/components/schemas/QueryNode'
        filters:
          $ref: '#/components/schemas/FilterNode'
        metadata:
          $ref: '#/components/schemas/ResourceMetadata'
    QueryNode:
      type: object
      description: |-
        One query node. A node is an `and` group, an `or` group, or one query. Do not combine those forms in the same object.
      properties:
        and:
          type: array
          description: Every child must match.
          items:
            $ref: '#/components/schemas/QueryNode'
        or:
          type: array
          description: Any child must match.
          items:
            $ref: '#/components/schemas/QueryNode'
        type:
          $ref: '#/components/schemas/SearchType'
        query:
          type: string
          description: Text or pattern to match.
          example: diesel engine
        field:
          type: string
          description: Document field to match. `id` is stored as `_id`.
          example: name.en
        boost:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Score multiplier for matches on this field. The default is 1.
          example: 2
        fuzzy:
          $ref: '#/components/schemas/Fuzzy'
    SearchType:
      type: string
      description: |-
        Match mode.

        * `TEXT` matches the query tokens.
        * `PHRASE` matches the query as adjacent words in order.
        * `AUTOCOMPLETE` matches the index field's autocomplete mode. `PREFIX` matches the start of a word. `NGRAM` matches a character sequence inside a word.
        * `WILDCARD` matches a pattern. `*` matches any number of characters. `?` matches one character. Fuzzy matching is not supported.
      enum:
        - TEXT
        - PHRASE
        - AUTOCOMPLETE
        - WILDCARD
    Fuzzy:
      type: object
      description: Edit-distance matching. Supported only when `type` is `TEXT` and `enabled` is `true`.
      properties:
        enabled:
          type: boolean
          description: When `true`, matches that are one or two edits from the query are included.
        maxEdits:
          type: integer
          description: Maximum edit distance. Required when `enabled` is `true`. Allowed values are 1 and 2.
          enum:
            - 1
            - 2
    FilterNode:
      type: object
      description: |-
        One filter node. A node is an `and` group, an `or` group, or a comparison. Do not combine those forms in the same object.

        Comparison fields must be indexed on the index named by `index`.
      properties:
        and:
          type: array
          minItems: 1
          description: Every child must match. The group must not be empty.
          items:
            $ref: '#/components/schemas/FilterNode'
        or:
          type: array
          minItems: 1
          description: At least one child must match. The group must not be empty.
          items:
            $ref: '#/components/schemas/FilterNode'
        field:
          type: string
          description: Document field to compare. `id` is stored as `_id`.
          example: status
        operator:
          $ref: '#/components/schemas/FilterOperator'
        value:
          description: |-
            Comparison value. The shape depends on `operator`.

            * `EQ`, `NEQ`, `GT`, `GTE`, `LT`, and `LTE` require one value.
            * `BETWEEN` requires an array of two values. The range is inclusive.
            * `IN` and `NOT_IN` require a non-empty array.
            * `EXISTS` requires a boolean. `true` matches documents where the field is present. `false` matches documents where the field is absent.
    FilterOperator:
      type: string
      description: Comparison applied to `field` and `value`.
      enum:
        - EQ
        - NEQ
        - GT
        - GTE
        - LT
        - LTE
        - BETWEEN
        - IN
        - NOT_IN
        - EXISTS
    SearchHit:
      type: object
      description: |-
        A matching document. Stored fields are returned with their API names. The identifier is `id`.

        The `name` is localized. Other stored fields are returned as they are stored. When `fields` limits the response, the response includes the requested fields and `id`.
      properties:
        id:
          type: string
          description: Document identifier.
          example: 64f1c2a8e4b0a1d2c3e4f5a6
        name:
          type: object
          additionalProperties:
            type: string
          description: Localized name. A specific `Accept-Language` value keeps one language. `*` keeps every stored language.
          example:
            en: Diesel engine
        _score:
          type: number
          description: Search relevance score. Included when `fields` is omitted, or when `fields` lists `_score`.
          example: 4.2
      additionalProperties: true
    ErrorMessage:
      type: object
      description: Error returned for a failed request.
      properties:
        code:
          type: integer
          description: HTTP status code.
        status:
          type: string
          description: HTTP status code as text.
        message:
          type: string
          description: Explanation of the failure.
        details:
          type: array
          description: Field-level or scope-level messages, when the failure has more than one part.
          items:
            type: object
            properties:
              message:
                type: string
                description: One part of the failure.
    ErrorMessageFault:
      type: object
      description: Authorization error returned by the API gateway.
      properties:
        fault:
          type: object
          properties:
            faultstring:
              type: string
              description: Authorization failure.
            detail:
              type: object
              properties:
                errorcode:
                  type: string
                  description: Gateway error code.
  examples:
    savedSearchCall:
      summary: Saved search
      value:
        query: diesel engine
        searchQueryId: red-cars
    textSearchRequest:
      summary: Text search with a status filter
      value:
        index: custom-entities
        queries:
          - type: TEXT
            query: diesel engine
            field: name.en
        filters:
          field: status
          operator: EQ
          value: ACTIVE
    fuzzySearchRequest:
      summary: Text search that allows one edit
      value:
        index: custom-entities
        queries:
          - type: TEXT
            query: diesel
            field: name.en
            fuzzy:
              enabled: true
              maxEdits: 1
    fuzzyTwoEditsRequest:
      summary: Text search that allows two edits
      value:
        index: custom-entities
        queries:
          - type: TEXT
            query: diesel engine
            field: name.en
            boost: 3
            fuzzy:
              enabled: true
              maxEdits: 2
        filters:
          field: status
          operator: NEQ
          value: ARCHIVED
    boostedFieldsRequest:
      summary: Text search with field boosts
      value:
        index: custom-entities
        queries:
          - type: TEXT
            query: diesel
            field: name.en
            boost: 5
          - type: TEXT
            query: diesel
            field: brand
            boost: 1
    severalQueriesRequest:
      summary: Different query text on different fields
      value:
        index: custom-entities
        queries:
          - type: TEXT
            query: red
            field: name.en
          - type: WILDCARD
            query: 'SKU-*'
            field: code
    andQueriesRequest:
      summary: Both queries must match
      value:
        index: custom-entities
        queries:
          and:
            - type: WILDCARD
              query: '*red*'
              field: name.en
            - type: WILDCARD
              query: '*Hybrid*'
              field: brand
    phraseSearchRequest:
      summary: Phrase search
      value:
        index: custom-entities
        queries:
          - type: PHRASE
            query: diesel engine
            field: name.en
    autocompleteSearchRequest:
      summary: Autocomplete search
      value:
        index: custom-entities
        queries:
          - type: AUTOCOMPLETE
            query: dies
            field: name.en
    wildcardSearchRequest:
      summary: Wildcard search
      value:
        index: custom-entities
        queries:
          - type: WILDCARD
            query: '*iese*'
            field: name.en
    filterSearchRequest:
      summary: Filter without a text query
      value:
        index: custom-entities
        filters:
          or:
            - field: status
              operator: EQ
              value: ACTIVE
            - field: status
              operator: EQ
              value: DRAFT
    rangeFilterRequest:
      summary: Inclusive numeric range
      value:
        index: custom-entities
        filters:
          field: horsepower
          operator: BETWEEN
          value:
            - 120
            - 250
    inFilterRequest:
      summary: Match any listed value
      value:
        index: custom-entities
        queries:
          - type: TEXT
            query: engine
            field: name.en
        filters:
          field: status
          operator: IN
          value:
            - ACTIVE
            - DRAFT
    existsFilterRequest:
      summary: Field must be present
      value:
        index: custom-entities
        filters:
          field: brand
          operator: EXISTS
          value: true
    nestedFilterRequest:
      summary: And group that contains an or group
      value:
        index: custom-entities
        queries:
          - type: TEXT
            query: diesel
            field: name.en
        filters:
          and:
            - field: horsepower
              operator: GTE
              value: 150
            - or:
                - field: status
                  operator: EQ
                  value: ACTIVE
                - field: status
                  operator: EQ
                  value: DRAFT
    searchHits:
      summary: Matching documents
      value:
        - id: 64f1c2a8e4b0a1d2c3e4f5a6
          name:
            en: Diesel engine
          status: ACTIVE
          horsepower: 180
          _score: 4.2
        - id: 64f1c2a8e4b0a1d2c3e4f5b7
          name:
            en: Diesel generator
          status: ACTIVE
          horsepower: 220
          _score: 3.1
