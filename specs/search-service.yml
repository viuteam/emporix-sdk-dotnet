      responses:
        '200':
          description: The job exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexJob'
              examples:
                One job:
                  value:
                    id: 66f1a2b3c4d5e6f708192a3b
                    status: success
                    type: create_index
                    indexId: vehicles
                    message: Creating index vehicles--vehicle for type vehicle
                    response: Index created.
                    metadata:
                      version: 1
                      createdAt: '2026-03-12T10:00:00.000Z'
                      modifiedAt: '2026-03-12T10:04:00.000Z'
        '401':
