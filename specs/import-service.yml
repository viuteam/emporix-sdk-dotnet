openapi: 3.0.0
info:
  title: Import Service
  version: ''
  description: |-
    The Emporix Import Service imports external master data into Emporix. A configuration groups one or more
    streams; each stream extracts from a source connection, maps fields to an Emporix target type, and
    upserts idempotently. Imports run asynchronously and stream per-stream progress over Server-Sent Events.

    This reference covers the operational surface available with the `importtool.import_trigger` scope:
    triggering, scheduling, monitoring, and cancelling import runs; managing the file queue of a
    file-based stream (upload, list, reorder, remove); reading configurations, streams, schedules, runs,
    and imported data; and reading the import analytics that summarise them. Administrative operations
    (creating and changing configurations, connections, streams, and mappings) require the
    `importtool.import_manage` scope.
  contact:
    name: Emporix
    url: https://emporix.com
    email: documentation@emporix.com
tags:
  - name: Configurations
    description: Read import configurations.
  - name: Streams
    description: Read the streams of a configuration.
  - name: Files
    description: >-
      The queue of files a file-based stream imports: upload one, see what is waiting, change the load
      order, remove one.
  - name: Schedules
    description: Read and set a configuration's run schedule.
  - name: Runs
    description: Trigger, monitor, and cancel import runs.
  - name: Data
    description: Read imported records.
  - name: Analytics
    description: Read aggregated import statistics, health, and the settings behind them.
  - name: License
    description: Read the tenant's import limits.
servers:
  - url: 'https://api.emporix.io'
paths:
  '/importtool/{tenant}/configs':
    parameters:
      - $ref: '#/components/parameters/trait_tenant'
    get:
      summary: Retrieving all import configurations
      description: |-
        Retrieves all import configurations defined for the tenant.

      operationId: GET-importtool-list-configs
      tags:
        - Configurations
      security:
        - OAuth2:
            - importtool.import_trigger
      responses:
        '200':
          description: The request was successful. The configurations are returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportConfig'
              examples:
                Configurations response:
                  $ref: '#/components/examples/ImportConfigs_Example'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
  '/importtool/{tenant}/configs/{id}':
    parameters:
      - $ref: '#/components/parameters/trait_tenant'
      - $ref: '#/components/parameters/trait_id'
    get:
      summary: Retrieving an import configuration
      description: |-
        Retrieves a single import configuration by its identifier.

      operationId: GET-importtool-get-config
      tags:
        - Configurations
      security:
        - OAuth2:
            - importtool.import_trigger
      responses:
        '200':
          description: The request was successful. The configuration is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportConfig'
              examples:
                Configuration response:
                  $ref: '#/components/examples/ImportConfig_Example'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '404':
          $ref: '#/components/responses/NotFound_404'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
  '/importtool/{tenant}/configs/{configId}/streams':
    parameters:
      - $ref: '#/components/parameters/trait_tenant'
      - $ref: '#/components/parameters/trait_configId'
    get:
      summary: Retrieving all streams of a configuration
      description: |-
        Retrieves the streams belonging to a configuration, ordered by sequence.

      operationId: GET-importtool-list-streams
      tags:
        - Streams
      security:
        - OAuth2:
            - importtool.import_trigger
      responses:
        '200':
          description: The request was successful. The streams are returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportStream'
              examples:
                Streams response:
                  $ref: '#/components/examples/ImportStreams_Example'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
  '/importtool/{tenant}/streams/{id}':
    parameters:
      - $ref: '#/components/parameters/trait_tenant'
      - $ref: '#/components/parameters/trait_id'
    get:
      summary: Retrieving a stream
      description: |-
        Retrieves a single stream by its identifier, including its resolved target types.

      operationId: GET-importtool-get-stream
      tags:
        - Streams
      security:
        - OAuth2:
            - importtool.import_trigger
      responses:
        '200':
          description: The request was successful. The stream is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportStream'
              examples:
                Stream response:
                  $ref: '#/components/examples/ImportStream_Example'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '404':
          $ref: '#/components/responses/NotFound_404'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
  '/importtool/{tenant}/streams/{streamId}/files':
    parameters:
      - $ref: '#/components/parameters/trait_tenant'
      - $ref: '#/components/parameters/trait_streamId'
    get:
      summary: Retrieving a stream's files
      description: |-
        Lists what a file-based stream still has to import, in the order it will be read, and what it has
        already dealt with. A file is identified by the SHA-256 of its content, so re-sending the same bytes
        is recognised however the file is named.
      operationId: GET-importtool-stream-files
      tags:
        - Files
      parameters:
        - schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
          in: query
          name: historyLimit
          description: |-
            Number of the stream's most recently handled files to return in `history`. A value below 1 is
            treated as 1, and a value above 500 as 500. This parameter does not limit `pending`: the queue is
            returned in full up to 2000 files, and `pendingTruncated` and `pendingTotal` indicate when it is
            longer than the response.
      security:
        - OAuth2:
            - importtool.import_trigger
      responses:
        '200':
          description: The request was successful. The queue and the history are returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileQueue'
              examples:
                File queue response:
                  $ref: '#/components/examples/FileQueue_Example'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '404':
          $ref: '#/components/responses/NotFound_404'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
    post:
      summary: Uploading a file for a stream to import
      description: |-
        Queues a delimited file (CSV or one of its variants) for a file-based stream to import on its next
        run. Nothing is imported by this request.

        The file is stored, and its content hash recorded, so the same bytes are never imported twice: a
        file this stream has already imported is refused rather than queued again. A file that previously
        failed is accepted, because the usual reason is that it has been fixed.

        The request is refused while the stream's job has a run in flight if the upload would replace bytes
        the stream already holds — a run may be reading them, and a retry may be waiting to re-read them.
        A file the stream has not seen before is a new queue entry and is accepted at any time.
      operationId: POST-importtool-stream-files
      tags:
        - Files
      security:
        - OAuth2:
            - importtool.import_trigger
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to import.
              required:
                - file
      responses:
        '200':
          description: The request was successful. The file is queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportFile'
              examples:
                Uploaded file response:
                  $ref: '#/components/examples/ImportFile_Example'
        '400':
          description: No file was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '404':
          $ref: '#/components/responses/NotFound_404'
        '409':
          description: >-
            The stream has already imported this exact file, the file is already queued, the stream does not
            read files, or a run in flight is using the bytes this upload would replace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '413':
          description: >-
            The file is larger than this environment's upload limit. Publish it at an HTTP(S) URL and set
            that as the connection's file URL instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '503':
          description: File upload is not configured in this environment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
  '/importtool/{tenant}/streams/{streamId}/files/limits':
    parameters:
      - $ref: '#/components/parameters/trait_tenant'
      - $ref: '#/components/parameters/trait_streamId'
    get:
      summary: Retrieving the file upload limits
      description: |-
        Returns the largest file this environment accepts, and whether uploading is available at all, so a
        client can state the limit and reject an oversize file before sending it.
      operationId: GET-importtool-stream-file-limits
      tags:
        - Files
      security:
        - OAuth2:
            - importtool.import_trigger
      responses:
        '200':
          description: The request was successful.
          content:
            application/json:
              schema:
                type: object
                title: fileUploadLimits
                properties:
                  maxUploadBytes:
                    type: integer
                    format: int64
                    description: The largest file accepted, in bytes.
                    example: 9437184
                  gatewayLimited:
                    type: boolean
                    description: >-
                      Whether `maxUploadBytes` is set by the API gateway in front of the service rather than by
                      the service itself. A larger file is then refused by the gateway, with the gateway's own
                      `413` error body, before it reaches the service. Use the connection's file URL for it.
                    example: true
                  uploadSupported:
                    type: boolean
                    description: >-
                      False when the environment has nowhere to store an uploaded file. A file URL on the
                      connection does not help: a fetched file is stored in the same place.
                    example: true
              examples:
                File upload limits response:
                  $ref: '#/components/examples/FileUploadLimits_Example'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '404':
          $ref: '#/components/responses/NotFound_404'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
  '/importtool/{tenant}/streams/{streamId}/files/order':
    parameters:
      - $ref: '#/components/parameters/trait_tenant'
      - $ref: '#/components/parameters/trait_streamId'
    put:
      summary: Setting the order in which files are imported
      description: |-
        Sets the order in which the waiting files are read. For an incremental feed the order is the data: a
        later file's values win on a key an earlier one also carries, so an older export must be placed before
        a newer one.

        The request takes every waiting file's identifier, in load order, rather than moving one file: ranks
        are only meaningful relative to each other, and a partial list would leave the omitted files at their
        old ranks interleaved with the new ones. A list that is not exactly the waiting set is refused.

        The request is refused while the job has a run in flight, which may be draining the queue as the order
        changes.
      operationId: PUT-importtool-stream-file-order
      tags:
        - Files
      security:
        - OAuth2:
            - importtool.import_trigger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                format: uuid
              description: Every waiting file's identifier, in the order they must be imported.
              example:
                - 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                - c56a4180-65aa-42ec-a945-5fd21dec0538
      responses:
        '200':
          description: The request was successful. The queue is returned in its new order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportFile'
              examples:
                Reordered file queue response:
                  $ref: '#/components/examples/ImportFiles_Example'
        '400':
          description: The list is not exactly the set of waiting files.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '404':
          $ref: '#/components/responses/NotFound_404'
        '409':
          description: The job has a run in flight, or the queue is too long to be reordered in one request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
  '/importtool/{tenant}/streams/{streamId}/files/{fileId}':
    parameters:
      - $ref: '#/components/parameters/trait_tenant'
      - $ref: '#/components/parameters/trait_streamId'
      - name: fileId
        in: path
        required: true
        description: The file's identifier.
        schema:
          type: string
          format: uuid
    delete:
      summary: Removing a file from the queue
      description: |-
        Removes a waiting file and deletes the stored bytes with it. Only a waiting file can be removed: one
        a run has claimed must not vanish underneath it, and one already imported is history — removing that
        record would make the same bytes importable again, which is the one thing the file ledger exists to
        prevent.

        The request is refused while the job has a run in flight: the run may claim the file at any moment,
        and a retry may be waiting to re-read it.
      operationId: DELETE-importtool-stream-file
      tags:
        - Files
      security:
        - OAuth2:
            - importtool.import_trigger
      responses:
        '204':
          description: The request was successful. The file is removed.
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '404':
          $ref: '#/components/responses/NotFound_404'
        '409':
          description: >-
            The file is no longer waiting — a run has claimed it or already imported it — or the job has a
            run in flight.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
  '/importtool/{tenant}/configs/{configId}/schedule':
    parameters:
      - $ref: '#/components/parameters/trait_tenant'
      - $ref: '#/components/parameters/trait_configId'
    get:
      summary: Retrieving a schedule
      description: |-
        Retrieves the cron schedule for a configuration.

      operationId: GET-importtool-get-schedule
      tags:
        - Schedules
      security:
        - OAuth2:
            - importtool.import_trigger
      responses:
        '200':
          description: The request was successful. The schedule is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
              examples:
                Schedule response:
                  $ref: '#/components/examples/Schedule_Example'
        '204':
          description: No schedule is configured for the configuration.
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
    put:
      summary: Scheduling an import job
      description: |-
        Creates or updates the cron schedule (cron expression, time zone, and enabled flag) that runs a configuration automatically.

      operationId: PUT-importtool-schedule-job
      tags:
        - Schedules
      security:
        - OAuth2:
            - importtool.import_trigger
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Schedule'
            examples:
              Every day at 02:00 Berlin time:
                value:
                  cron: '0 0 2 * * *'
                  timezone: Europe/Berlin
                  enabled: true
      responses:
        '200':
          description: The request was successful. The schedule has been saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
              examples:
                Schedule response:
                  $ref: '#/components/examples/Schedule_Example'
        '400':
          description: >-
            The `cron` expression or `timezone` value is invalid. The service expects a six-field cron
            expression (`second minute hour day-of-month month day-of-week`). A five-field expression
            such as `0 * * * *` is rejected. The service does not store it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorMessage'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '404':
          $ref: '#/components/responses/NotFound_404'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
    delete:
      summary: Removing a schedule
      description: |-
        Removes the schedule. The configuration then runs only when it is triggered.

        The request is idempotent. Removing a schedule that does not exist also returns `204`.
        Unlike creating a schedule, this request does not require the configuration to exist.
        Use it to remove a schedule that remains after the configuration is deleted.
      operationId: deleteSchedule
      tags:
        - Schedules
      security:
        - OAuth2:
            - importtool.import_trigger
      responses:
        '204':
          description: The schedule has been removed. The configuration now runs only when triggered.
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
  '/importtool/{tenant}/configs/{configId}/stream-order':
    parameters:
      - $ref: '#/components/parameters/trait_tenant'
      - $ref: '#/components/parameters/trait_configId'
    get:
      summary: Retrieving the stream run order
      description: |-
        Retrieves the order in which the configuration's streams run, and the dependencies behind that order.

        Dependencies between streams decide the order. Sequence breaks ties.

        Dependencies come from four sources:

        * an explicit dependency on another stream
        * a mapping that references a type another stream produces
        * a `COMPOSITE_CHILD` stream with `childStrategy` set to `EMBED` – runs before the parent that embeds it
        * a `COMPOSITE_CHILD` stream with `childStrategy` set to `PATCH`, or a `COMPOSITE_MERGE` stream – run after the parent they update

        Use this endpoint rather than calculating the order yourself. Mapping transformations add
        dependencies that a single stream definition does not show. An order calculated without those
        dependencies can differ from the order used at run time.
      operationId: GET-importtool-stream-order
      tags:
        - Streams
      security:
        - OAuth2:
            - importtool.import_trigger
      responses:
        '200':
          description: The request was successful. The stream order is returned.
          content:
            application/json:
              schema:
                type: object
                title: streamOrder
                properties:
                  order:
                    type: array
                    items:
                      type: string
                    description: Stream names in the order they run.
                  prereqs:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                    description: >-
                      For each stream name, the streams that must run before it. A stream with no
                      dependencies has an empty list.
              examples:
                Stream order:
                  value:
                    order:
                      - vendor
                      - purchaseOrder
                      - purchaseOrderLine
                    prereqs:
                      vendor: []
                      purchaseOrder:
                        - vendor
                      purchaseOrderLine:
                        - purchaseOrder
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
  '/importtool/{tenant}/configs/{configId}/runs':
    parameters:
      - $ref: '#/components/parameters/trait_tenant'
      - $ref: '#/components/parameters/trait_configId'
    post:
      summary: Triggering an import run
      description: |-
        Requests an import run for the configuration and returns immediately with the run in the `QUEUED`
        status. The run starts when a worker of the Import Service is free, usually within moments, and then
        has the `RUNNING` status. If `maxConcurrentImports` runs are already executing for the tenant, the run
        waits until one of them finishes. `queueWaitingFor` says what a queued run waits for. To follow the
        run's progress, retrieve the run or stream its progress events.

        A configuration has at most one run executing and at most one run queued. The service rejects a
        request with a `409 Conflict` response while the configuration has a run in the `QUEUED`, `RUNNING`, or
        `RESUMABLE` status.

        A scheduled run is not rejected. It is queued behind the configuration's current run and starts when
        that run finishes. If the schedule requests another run while the configuration's run is still
        queued, the service adds the request to the queued run instead of queuing a second run, and counts it
        in `supersededRequests`. The service does this only when the queued run is a real run of the whole
        configuration. If the queued run is a dry run, a run of selected streams, or a retry, the scheduled run
        waits until that run starts and is then queued behind it.

        A run executes each stream's published mappings. Saved mapping changes that are not published yet are
        the draft mappings, and they take effect only after they are published. Publishing mappings is an
        administrative operation that requires the `importtool.import_manage` scope and is not covered in this
        reference. A real run, or a dry run that uses the published mappings, fixes the published mapping version of
        each stream when it starts, so a version published during the run applies from the next run. The run
        reports these versions in `mappingVersions`. A dry run of the draft mappings does not use published
        versions and does not report `mappingVersions`.

        A stream whose mappings have never been published is not run. Its entry in the run details (`streams` in
        the response of retrieving a run) has the `ABORTED` status and a `message` that gives the reason, and the
        run finishes with the `PARTIAL` status. The service refuses the whole run when `streamIds` names a stream
        whose mappings have never been published, or when every enabled stream is in that state.

        The refusal does not change the response to this request: the service still returns `200` with the run,
        and the run then finishes with the `ABORTED` status and a `message` that names the streams. Retrieve the
        run to check its final status.
      operationId: POST-importtool-trigger-run
      tags:
        - Runs
      security:
        - OAuth2:
            - importtool.import_trigger
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum:
                    - FULL
                    - DELTA
                  description: The run mode. When omitted, defaults to `DELTA`.
                  example: DELTA
                dryRun:
                  type: boolean
                  description: When `true`, the run maps and validates but performs no remote writes.
                  example: false
                mappings:
                  type: string
                  enum:
                    - published
                    - draft
                  default: published
                  description: >-
                    Dry-run only. Which mappings the dry run uses. `published` uses each stream's published
                    mappings, which is what a real run executes. `draft` uses the draft mappings, so you can check
                    them before publishing. When omitted, defaults to `published`. A dry run with `published`
                    handles streams whose mappings have never been published in the same way as a real run. The field
                    has no effect when `dryRun` is `false`, because a real run always uses the published mappings.
                  example: published
                force:
                  type: boolean
                  description: >-
                    When `true`, every extracted record is rewritten, even if unchanged. It bypasses the idempotency `skip-if-unchanged` check. Use it to force target IDs and values to be rewritten.
                  example: false
                sampleSize:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: >-
                    Dry-run only. How many mapped records to sample per stream for the preview returned as
                    `dryRunSample`. Clamped to 1-100; defaults to 25.
                  example: 25
                origin:
                  type: string
                  maxLength: 40
                  description: >-
                    What requested this run. Examples: `Dashboard`, an integration scenario name, or a scheduler name.
                    The `trigger` field records only `MANUAL` or `SCHEDULED`. Use `origin` when more than one system
                    calls this endpoint. If you omit `origin` or send a blank value, the service stores the `trigger`
                    value. The service rejects values longer than 40 characters and values that contain control
                    characters. It does not shorten them.
                  example: Make scenario 42
                streamIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: >-
                    The stream identifiers to run. Omit the field to run every stream in the configuration.
                    Send a list of stream IDs to run only those streams. Do not send stream names; use the
                    `id` values from the stream resource.

                    The service rejects an empty list. It also rejects a list that includes no stream from
                    this configuration. Listed streams still run in the computed stream order, not in list
                    order.

                    The service also rejects a stream that cannot produce data on its own. A `COMPOSITE_CHILD`
                    stream with `childStrategy` set to `EMBED` is written by its parent. A child that reads
                    values captured during the parent run also cannot run alone. Either stream without its
                    parent would complete successfully without importing records.
                  example:
                    - 8f1b6a5c-2d7e-4a91-9c33-0b5e4d2a7f10
            examples:
              Full run:
                value:
                  mode: FULL
                  origin: Dashboard
              Delta dry run:
                value:
                  mode: DELTA
                  dryRun: true
              Dry run of unpublished mapping changes:
                value:
                  mode: FULL
                  dryRun: true
                  mappings: draft
              Run only two streams:
                value:
                  mode: DELTA
                  streamIds:
                    - 8f1b6a5c-2d7e-4a91-9c33-0b5e4d2a7f10
                    - 1c9d3e77-45ab-4f02-8e6d-77a1b0c9e254
      responses:
        '200':
          description: The request was successful. The run has been queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRun'
              examples:
                Run response:
                  $ref: '#/components/examples/ImportRun_Example'
        '400':
          description: >-
            The request is invalid. For example, `dryRun` is `true` and `mappings` has a value other than
            `published` or `draft`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: string
                    format: date-time
                    description: When the error occurred.
                  status:
                    type: integer
                    description: HTTP status code.
                  error:
                    type: string
                    description: HTTP status reason phrase.
                  path:
                    type: string
                    description: The request path.
              examples:
                Invalid mappings value:
                  value:
                    timestamp: '2026-09-28T09:15:02.118+00:00'
                    status: 400
                    error: Bad Request
                    path: /importtool/mytenant/configs/7c9e6679-7425-40de-944b-e07fc1f90ae7/runs
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '409':
          $ref: '#/components/responses/Conflict_409'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
    get:
      summary: Retrieving run history
      description: |-
        Retrieves the run history for a configuration, most recent first.

      operationId: GET-importtool-list-runs
      tags:
        - Runs
      parameters:
        - $ref: '#/components/parameters/trait_page'
        - $ref: '#/components/parameters/trait_size'
      security:
        - OAuth2:
            - importtool.import_trigger
      responses:
        '200':
          description: The request was successful. The run history is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRunPage'
              examples:
                Run history response:
                  $ref: '#/components/examples/ImportRunPage_Example'
        '401':
          $ref: '#/components/responses/Unauthorized_401'
        '403':
          $ref: '#/components/responses/Forbidden_403'
        '500':
          $ref: '#/components/responses/InternalServiceError_500'
